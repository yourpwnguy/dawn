# dawn example configuration.
#
# Copy this to /etc/dawn/config.toml and edit as needed. Every key is optional;
# this file shows the built-in defaults except where noted. Run
# `dawn --check-config` after editing.

[ui]
# Unknown families fall back to the embedded Inter face.
font = "Inter"
font_size = 17
fullscreen = true

# The login card and its fields. Every key is optional; the renderer derives
# sizes from ui.font_size unless you override them here. `ui.card_width` and
# `ui.greeting` still work as legacy aliases.
[login]
greeting = ""
width = 380
padding = 26
gap = 14
radius = 18
# layout = "card"             # card, or hero for a fixed website-style panel
# surface = "glass"           # glass, flat, or none for no panel/border/shadow
# show_shadow = true
# show_border = true
# rotation = 0                # rotate the whole card
# height = 0                  # hero fixed height; 0 derives it from content
# panel = "#0f1923e6"         # hero fill colour
# panel_fade = [0.38, 0.62]   # hero fade into the wallpaper
# tab = "Login"               # small hero tab label
# form_offset = [32, 52]      # hero form position inside the card
# form_width = 420            # hero form width
# Let the pointer move the whole card. A click on a field still focuses it.
draggable = false
show_session = true
show_hints = true
show_picker = true
# picker_title = "Choose a session"
# busy_text = "Signing in..."
# dry_run_badge = "DRY RUN"
# no_sessions = "No desktop sessions found. Install one or set [sessions].dirs."

# Shared field styling. Username and password inherit this table and can
# override any key individually.
[login.field]
# label = "Account"
# font_size = 18
# height = 44
# radius = 10
# padding = 14
# background = "#101726cc"
# background_end = "#10172644"
# border = "#ffffff22"
# bracket = "#ffffff55"
# bracket_gap = 10
# text = "#f2f6ff"
# placeholder_color = "#a9b4c8"
# focus = "#7db1ff"
# caret = "#7db1ff"
# caret_width = 2
# icon = "user"              # user, lock, or none
# icon_size = 20
# icon_gap = 10
# icon_color = "#f2f6ff"

[login.username]
placeholder = "Username"

[login.password]
placeholder = "Password"
# mask = "*"

[login.session]
label = "Session"
change_hint = "Tab to change"
empty = "No sessions found"

[login.hints]
username = "Enter  Continue      Tab  Password      Esc  Clear"
password = "Enter  Sign in      Tab  Session      Esc  Clear"
picker = "Up/Down  Choose      Enter  Select      Esc  Cancel"
# busy = "Signing in..."

# A pointer-clickable submit button. Off by default, so the classic card stays
# keyboard-only. It sends the same Enter key as the keyboard.
# [login.button]
# show = true
# text = "Sign in"
# gap = 16
# height = 44
# radius = 8
# font_size = 0
# background = "#7db1ff"
# background_end = "#4f8ff0"
# gradient_angle = 90
# text_color = "#08111f"
# bold = true
# tracking = 0.04
# Hover colour and a directional wipe. fade, left, right, up, down, or center.
# hover_background = "#9cc4ff"
# hover_direction = "left"
# hover_ms = 180
# hover_scale = 1.02
# glow = "#7db1ff"
# glow_size = 10
# One of none, sweep, sheen, pulse, or corners. Runs only while hovered.
# effect = "sweep"
# effect_color = "#ffffff"
# effect_ms = 1600
# effect_strength = 0.2

# Decorative images and text inside the card. They paint before the fields and
# can never cover an input. See examples/themes/fischl/config.toml for a full use.
# [[login.decor]]
# kind = "text"
# text = "Footer"
# size = 12
# color = "#a9b4c8"
# anchor = "bottom-right"
# offset = [24, 20]

[clock]
enabled = true
style = "digital"          # or "analog"; analog size is the dial diameter
time_format = "%H:%M"
date_format = "%A, %B %d"
hour12 = false
seconds = false
# timezone = "Europe/Berlin"
# posix_locale = true
anchor = "top-center"
offset = [0, 48]
size = 54
date_size = 18
# color = "#f2f6ff"
# date_color = "#a9b4c8"
draggable = true

[media]
enabled = true
anchor = "bottom-left"
offset = [32, 32]
size = 16
show_art = true
# color = "#f2f6ff"
# Show the last known track before login. Set false on shared machines.
show_before_login = true
# Keep the last track when the player pauses, stops, or exits.
keep_last = true
draggable = true

[background]
# auto uses the image when set, otherwise the gradient. Other values:
# solid, gradient, image, animated, video.
kind = "auto"
color = "#0b1020"
gradient = true
# image = "wallpapers/dawn.gif"
# image = "wallpapers/dawn.mp4"   # requires ffmpeg
fit = "cover"              # cover, contain, or fill
# 0 follows the source frame rate. A positive value caps it.
fps = 0
memory_limit_mb = 128
idle_pause_secs = 45

# Per-output overrides. The output name comes from the compositor.
# [background.monitors.DP-1]
# kind = "image"
# image = "wallpapers/left.png"
# fit = "contain"

[theme]
preset = "glass-dark"      # glass-dark, glass-light, or minimal
# Every token can be overridden:
# tint = "#101726cc"
# border = "#ffffff40"
# shadow = "#00000066"
# focus_ring = "#7db1ff"
# [theme.blur]
# size = 8
# passes = 3
# noise = 0.0117
# contrast = 0.8916
# brightness = 0.8172
# vibrancy = 0.1696
# vibrancy_darkness = 0.0
# refresh_ms = 300
# corner_radius = 18
# spacing = 1.0
# noise = true
# min_contrast = 4.5

[motion]
enabled = true
reduced = false
boot_ms = 450
focus_ms = 160
shake_ms = 320
# Time constant for the pointer drag easing. 0 makes dragging snap.
drag_ms = 120

[layout]
# Remember dragged positions. The default file is
# $XDG_STATE_HOME/dawn/layout.toml, then ~/.local/state/dawn/layout.toml,
# then /var/lib/dawn/layout.toml.
save = false
# file = "/var/lib/dawn/layout.toml"

[power]
low_power = false

[sessions]
dirs = ["/usr/share/wayland-sessions", "/usr/share/xsessions"]
# default = "hyprland"

[plugins]
enabled = true
dirs = ["/usr/share/dawn/plugins", "~/.config/dawn/plugins"]

[auth]
# Leave unset in a real greeter: greetd sets GREETD_SOCK.
# socket = "/run/greetd.sock"
timeout_secs = 120
