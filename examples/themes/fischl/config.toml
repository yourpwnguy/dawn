# dawn showcase: Fischl, Prinzessin der Verurteilung, Sovereign of
# Immernachtreich, investigator of the Mondstadt Adventurers' Guild.
#
# Fischl is a kind, bookish girl who performs a grand royal fantasy with total
# commitment, with the night raven Oz translating for her. The login is staged
# as a royal decree hung in the night: a violet banner, a gold crown, a raven,
# a crescent moon, and a field of stars. Her constellation is Corvus, so the
# raven is the brand mark as well as the companion.
#
# The wallpaper is example media in the bundle. Check its
# provenance before redistributing it. Playing it needs ffmpeg on PATH.
#
# Noto Serif carries the decree's formal voice. If it is missing, dawn falls
# back to the embedded Inter face.

[ui]
font = "Noto Serif"
font_size = 17
fullscreen = true

[login]
layout = "hero"
anchor = "center"
width = 1888
height = 1048
radius = 0
padding = 0
gap = 20
surface = "none"
show_shadow = false
show_border = false
draggable = false
show_session = false
show_hints = true
show_picker = false
tab = ""
form_offset = [1210, 430]
form_width = 470
greeting = ""

[login.field]
height = 62
radius = 2
padding = 26
font_size = 17
background = "#1a1238ee"
background_end = "#2a1b58ee"
border = "#e6c56e55"
bracket = "#b48cff"
bracket_gap = 10
text = "#f4efff"
placeholder_color = "#a894d8"
focus = "#b48cff"
caret = "#e6c56e"
caret_width = 2
icon_size = 19
icon_gap = 14
icon_color = "#e6c56e"

[login.username]
label = "SUBJECT"
placeholder = "Traveler name"
icon = "user"

[login.password]
label = "ROYAL SEAL"
placeholder = "Password"
icon = "lock"
mask = "•"

[login.button]
show = true
text = "ENTER THE NIGHT"
gap = 26
height = 58
radius = 2
font_size = 16
bold = true
tracking = 0.14
background = "#6b4bd6"
background_end = "#2a1b58"
gradient_angle = 90
text_color = "#fff6da"
bracket = "#e6c56e"
bracket_gap = 8
hover_background = "#8a6cf0"
hover_background_end = "#3c2878"
hover_direction = "center"
hover_ms = 220
hover_scale = 1.02
hover_lift = 2
glow = "#b48cff"
glow_size = 16
effect = "sheen"
effect_color = "#f4efff"
effect_ms = 2400
effect_angle = 118
effect_strength = 0.3

# The banner is the stage. It hangs behind every field and ornament.
[[login.decor]]
kind = "image"
image = "assets/banner.png"
width = 760
anchor = "top-left"
offset = [1070, 120]

# A crown sits at the top of the banner without touching the title. The raven
# floats below the form, where it cannot cover a field.
[[login.decor]]
kind = "image"
image = "assets/crown.png"
width = 150
anchor = "top-left"
offset = [1680, 154]
opacity = 0.95
[login.decor.motion]
sway = 3.0
sway_ms = 6200
pulse = 0.03
pulse_ms = 3200
fade = 0.1
fade_ms = 7000
phase = 0.12

[[login.decor]]
