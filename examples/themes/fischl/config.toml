[background]
kind = "video"
image = "wallpaper.mp4"
fit = "cover"
fps = 0
memory_limit_mb = 1024
idle_pause_secs = 0

[theme]
preset = "glass-dark"
text = "#f4efff"
muted = "#c3b6e6"
accent = "#e6c56e"
error = "#ff9bb0"
tint = "#100b26cc"
border = "#e6c56e44"
shadow = "#05030eaa"
focus_ring = "#b48cff"
corner_radius = 2
spacing = 1.0
noise = false
min_contrast = 4.5

[theme.blur]
enabled = false

[motion]
enabled = true
reduced = false
boot_ms = 650
focus_ms = 180
shake_ms = 320
drag_ms = 120

[layout]
save = false

[clock]
enabled = false

[media]
enabled = false

[power]
low_power = false

[sessions]
dirs = ["/usr/share/wayland-sessions", "/usr/share/xsessions"]

[plugins]
enabled = false

[auth]
timeout_secs = 120
