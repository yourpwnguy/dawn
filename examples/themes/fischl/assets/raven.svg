    <path d="M148 150 C132 128 112 106 88 86 C68 70 44 60 18 58" stroke-width="2.4" opacity=".55" transform="translate(340 0) scale(-1 1)"/>
    <path d="M18 58 C34 72 44 84 48 96 C34 90 18 94 6 102 C26 108 44 118 54 130 C42 126 26 132 14 140 C38 146 58 154 68 166 C56 164 40 170 30 178" stroke-width="1.2" opacity=".38"/>
