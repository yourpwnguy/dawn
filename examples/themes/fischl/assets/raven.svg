  <circle cx="175" cy="84" r="2.2" fill="#07050f"/>
  <circle cx="172.9" cy="82" r="1" fill="#f4efff"/>

  <!-- small electro sparks -->
  <g fill="#b48cff">
    <path d="M42 56 L44.5 64 L52 66.5 L44.5 69 L42 77 L39.5 69 L32 66.5 L39.5 64 Z" opacity=".7"/>
    <path d="M300 74 L302 81 L309 83 L302 85 L300 92 L298 85 L291 83 L298 81 Z" opacity=".6"/>
