<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="760" height="900" viewBox="0 0 760 900">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dfa0"/>
      <stop offset=".45" stop-color="#e6c56e"/>
      <stop offset="1" stop-color="#a97a2f"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a97a2f"/>
      <stop offset=".18" stop-color="#e6c56e"/>
      <stop offset=".5" stop-color="#f8e6ae"/>
      <stop offset=".82" stop-color="#e6c56e"/>
      <stop offset="1" stop-color="#a97a2f"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1b58"/>
      <stop offset=".32" stop-color="#181039"/>
      <stop offset=".68" stop-color="#100b26"/>
      <stop offset="1" stop-color="#090617"/>
    </linearGradient>
    <radialGradient id="violetGlow" gradientUnits="userSpaceOnUse" cx="380" cy="190" r="330">
      <stop offset="0" stop-color="#6b4bd6" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#6b4bd6" stop-opacity=".12"/>
      <stop offset="1" stop-color="#6b4bd6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="edgeGold" gradientUnits="userSpaceOnUse" cx="380" cy="440" r="430">
      <stop offset="0" stop-color="#e6c56e" stop-opacity="0"/>
      <stop offset=".58" stop-color="#e6c56e" stop-opacity="0"/>
      <stop offset=".84" stop-color="#e6c56e" stop-opacity=".14"/>
      <stop offset="1" stop-color="#e6c56e" stop-opacity=".5"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07050f" stop-opacity=".5"/>
      <stop offset=".16" stop-color="#07050f" stop-opacity="0"/>
      <stop offset=".36" stop-color="#b48cff" stop-opacity=".08"/>
      <stop offset=".5" stop-color="#b48cff" stop-opacity="0"/>
      <stop offset=".64" stop-color="#b48cff" stop-opacity=".08"/>
      <stop offset=".84" stop-color="#07050f" stop-opacity="0"/>
      <stop offset="1" stop-color="#07050f" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="lineFade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="380" y2="0">
      <stop offset="0" stop-color="#e6c56e" stop-opacity="0"/>
      <stop offset=".15" stop-color="#e6c56e" stop-opacity=".5"/>
      <stop offset="1" stop-color="#b48cff" stop-opacity=".7"/>
    </linearGradient>
    <clipPath id="bannerClip">
      <path d="M120 80 H640 V790 L380 716 L120 790 Z"/>
    </clipPath>
    <g id="spark">
      <path d="M0-7C.9-2.4 2.4-.9 7 0 2.4.9.9 2.4 0 7-0.9 2.4-2.4.9-7 0-2.4-.9-.9-2.4 0-7Z"/>
    </g>
  </defs>

  <!-- hanging rings on the rod -->
  <g fill="none" stroke="url(#gold)" stroke-width="3">
    <circle cx="204" cy="64" r="10"/>
    <circle cx="556" cy="64" r="10"/>
  </g>
  <path d="M204 74 V88 M556 74 V88" stroke="url(#gold)" stroke-width="2.5"/>

  <!-- top rod and finials -->
  <rect x="58" y="52" width="644" height="16" rx="8" fill="url(#goldH)"/>
  <path d="M58 58 H702" stroke="#fff3c8" stroke-opacity=".55" stroke-width="1.5"/>
  <path d="M58 46 L34 60 L58 74 Z" fill="url(#gold)"/>
  <circle cx="30" cy="60" r="6" fill="url(#gold)"/>
  <path d="M702 46 L726 60 L702 74 Z" fill="url(#gold)"/>
  <circle cx="730" cy="60" r="6" fill="url(#gold)"/>
  <circle cx="58" cy="60" r="9" fill="url(#gold)"/>
  <circle cx="702" cy="60" r="9" fill="url(#gold)"/>

  <!-- cloth -->
  <g clip-path="url(#bannerClip)">
    <path d="M120 80 H640 V790 L380 716 L120 790 Z" fill="url(#cloth)"/>
    <ellipse cx="380" cy="330" rx="360" ry="360" fill="url(#violetGlow)"/>
    <path d="M120 80 H640 V790 L380 716 L120 790 Z" fill="url(#edgeGold)"/>
    <path d="M120 80 H640 V790 L380 716 L120 790 Z" fill="url(#sheen)"/>

    <!-- starfield -->
    <g fill="#f4efff">
      <circle cx="182" cy="148" r="1.3" opacity=".8"/>
      <circle cx="236" cy="204" r="1" opacity=".55"/>
      <circle cx="302" cy="166" r="1.4" opacity=".8"/>
      <circle cx="438" cy="150" r="1" opacity=".6"/>
      <circle cx="522" cy="192" r="1.3" opacity=".7"/>
      <circle cx="594" cy="146" r="1" opacity=".5"/>
      <circle cx="158" cy="262" r="1" opacity=".4"/>
      <circle cx="602" cy="272" r="1.2" opacity=".5"/>
      <circle cx="202" cy="342" r="1" opacity=".45"/>
      <circle cx="562" cy="362" r="1.4" opacity=".55"/>
      <circle cx="150" cy="452" r="1" opacity=".35"/>
      <circle cx="612" cy="448" r="1.1" opacity=".4"/>
      <circle cx="192" cy="566" r="1" opacity=".4"/>
      <circle cx="580" cy="556" r="1.2" opacity=".45"/>
      <circle cx="242" cy="642" r="1" opacity=".35"/>
      <circle cx="540" cy="654" r="1" opacity=".4"/>
      <circle cx="162" cy="704" r="1.2" opacity=".5"/>
      <circle cx="610" cy="702" r="1" opacity=".45"/>
      <circle cx="322" cy="622" r="1" opacity=".4"/>
      <circle cx="442" cy="612" r="1.1" opacity=".45"/>
      <circle cx="268" cy="738" r="1" opacity=".4"/>
      <circle cx="490" cy="740" r="1.1" opacity=".4"/>
    </g>
    <g fill="#b48cff" opacity=".75">
      <use xlink:href="#spark" transform="translate(262 182) scale(.85)"/>
      <use xlink:href="#spark" transform="translate(472 212) scale(.7)"/>
      <use xlink:href="#spark" transform="translate(212 306) scale(.6)"/>
      <use xlink:href="#spark" transform="translate(552 312) scale(.65)"/>
      <use xlink:href="#spark" transform="translate(286 682) scale(.7)"/>
      <use xlink:href="#spark" transform="translate(482 668) scale(.6)"/>
    </g>

    <!-- Corvus-like constellation, kept to the upper third so the form area stays calm -->
    <g stroke="url(#lineFade)" stroke-width="1.2" fill="none">
      <path d="M244 128 L300 166 L372 142 L424 194 L402 252 L332 240 Z"/>
      <path d="M300 166 L262 212"/>
    </g>
    <g fill="#e6c56e">
      <circle cx="244" cy="128" r="2.6"/>
      <circle cx="300" cy="166" r="3.2"/>
      <circle cx="372" cy="142" r="2.4"/>
      <circle cx="424" cy="194" r="2.8"/>
      <circle cx="402" cy="252" r="2.4"/>
      <circle cx="332" cy="240" r="2"/>
      <circle cx="262" cy="212" r="1.8"/>
    </g>
  </g>

  <!-- sleeve below the rod -->
  <rect x="120" y="80" width="520" height="24" fill="#1a1238" fill-opacity=".9"/>
  <path d="M120 104 H640" stroke="url(#gold)" stroke-width="2" opacity=".8"/>
  <path d="M120 80 H640" stroke="url(#gold)" stroke-width="2" opacity=".5"/>

  <!-- double gold border -->
  <path d="M120 80 H640 V790 L380 716 L120 790 Z" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <path d="M146 106 H614 V760 L380 690 L146 760 Z" fill="none" stroke="url(#gold)" stroke-width="2" opacity=".9"/>
  <path d="M152 112 H608 V753 L380 684 L152 753 Z" fill="none" stroke="#b48cff" stroke-width="1" opacity=".35"/>

  <!-- corner and notch accents -->
  <g fill="url(#gold)">
    <path d="M120 80 L150 80 L120 110 Z"/>
    <path d="M640 80 L610 80 L640 110 Z"/>
    <path d="M380 716 L394 700 L380 684 L366 700 Z"/>
  </g>
  <path d="M146 106 C168 106 180 118 180 140" fill="none" stroke="url(#gold)" stroke-width="2" opacity=".75"/>
  <path d="M614 106 C592 106 580 118 580 140" fill="none" stroke="url(#gold)" stroke-width="2" opacity=".75"/>

  <!-- tassels at the swallowtail tips -->
  <g>
    <path d="M120 790 V812" stroke="url(#gold)" stroke-width="2.5"/>
    <circle cx="120" cy="814" r="5" fill="url(#gold)"/>
    <path d="M111 818 H129 L126 848 H114 Z" fill="url(#gold)"/>
    <path d="M115 820 V845 M120 820 V847 M125 820 V845" stroke="#8a5f22" stroke-width="1" opacity=".6"/>
    <path d="M120 790 V812" stroke="url(#gold)" stroke-width="2.5" transform="translate(520 0)"/>
    <circle cx="640" cy="814" r="5" fill="url(#gold)"/>
    <path d="M631 818 H649 L646 848 H634 Z" fill="url(#gold)"/>
    <path d="M635 820 V845 M640 820 V847 M645 820 V845" stroke="#8a5f22" stroke-width="1" opacity=".6"/>
  </g>
</svg>
