<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="240" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="moonGold" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset=".32" stop-color="#f8e6ae"/>
      <stop offset=".66" stop-color="#efd794"/>
      <stop offset=".88" stop-color="#e6c56e"/>
      <stop offset="1" stop-color="#d4a24a"/>
    </linearGradient>
    <linearGradient id="starGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#f4efff"/>
      <stop offset="1" stop-color="#e6c56e"/>
    </linearGradient>
    <g id="star4">
      <path d="M0-9C1.2-3.1 3.1-1.2 9 0 3.1 1.2 1.2 3.1 0 9-1.2 3.1-3.1 1.2-9 0-3.1-1.2-1.2-3.1 0-9Z"/>
    </g>
    <clipPath id="crescentClip">
      <path fill-rule="evenodd" d="M112 42 A78 78 0 1 0 112 198 A78 78 0 1 0 112 42 Z
        M148 32 A70 70 0 1 0 148 172 A70 70 0 1 0 148 32 Z"/>
    </clipPath>
  </defs>

  <!-- crescent: one disc minus an offset disc -->
  <path fill-rule="evenodd" fill="url(#moonGold)"
        d="M112 42 A78 78 0 1 0 112 198 A78 78 0 1 0 112 42 Z
           M148 32 A70 70 0 1 0 148 172 A70 70 0 1 0 148 32 Z"/>

  <!-- edge light and shading, clipped so no line escapes the silhouette -->
  <g clip-path="url(#crescentClip)">
    <circle cx="112" cy="120" r="78" fill="none" stroke="#fff8e0" stroke-width="4.5" opacity=".55"/>
    <circle cx="148" cy="102" r="70" fill="none" stroke="#c9963f" stroke-width="3" opacity=".35"/>
    <path d="M96 58 C74 74 64 102 68 132 C72 158 88 178 110 188" fill="none" stroke="#ffffff" stroke-width="3" opacity=".3"/>
    <path d="M50 120 C54 150 72 174 96 186" fill="none" stroke="#c9963f" stroke-width="2.4" opacity=".3"/>
  </g>

  <!-- companion stars -->
  <g fill="url(#starGold)">
    <use xlink:href="#star4" transform="translate(190 50) scale(1)"/>
    <use xlink:href="#star4" transform="translate(208 138) scale(.62)"/>
    <use xlink:href="#star4" transform="translate(166 204) scale(.75)"/>
    <use xlink:href="#star4" transform="translate(50 52) scale(.55)"/>
  </g>
  <g fill="#f4efff" opacity=".9">
    <circle cx="212" cy="90" r="2.2"/>
    <circle cx="180" cy="216" r="1.7"/>
    <circle cx="40" cy="86" r="1.6"/>
    <circle cx="60" cy="30" r="1.9"/>
  </g>
  <g fill="#b48cff" opacity=".65">
    <circle cx="198" cy="184" r="1.9"/>
    <circle cx="28" cy="150" r="1.7"/>
  </g>
</svg>
