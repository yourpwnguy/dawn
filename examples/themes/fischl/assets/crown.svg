<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="280" height="220" viewBox="0 0 280 220">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset=".28" stop-color="#f0d183"/>
      <stop offset=".62" stop-color="#e6c56e"/>
      <stop offset="1" stop-color="#a97a2f"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6c56e"/>
      <stop offset="1" stop-color="#8a5f22"/>
    </linearGradient>
    <linearGradient id="jewel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0e6ff"/>
      <stop offset=".35" stop-color="#b48cff"/>
      <stop offset=".7" stop-color="#6b4bd6"/>
      <stop offset="1" stop-color="#2a1b58"/>
    </linearGradient>
    <radialGradient id="aura" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#b48cff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#b48cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="140" cy="128" rx="126" ry="100" fill="url(#aura)"/>

  <!-- crown body -->
  <path d="M42 172 L44 102 L74 126 L98 64 L120 104 L140 34 L160 104 L182 64 L206 126 L236 102 L238 172 Z"
        fill="url(#gold)" stroke="#8a5f22" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M44 102 L74 126 L98 64 L120 104 L140 34 L160 104 L182 64 L206 126 L236 102 L238 150 L206 136 L182 152 L160 140 L140 154 L120 140 L98 152 L74 136 L44 150 Z"
        fill="#a97a2f" opacity=".22"/>
  <path d="M60 160 L60 116 M96 148 L104 82 M140 148 L140 50 M184 148 L176 82 M220 160 L220 116"
        stroke="#fff1c4" stroke-width="1.4" opacity=".3"/>

  <!-- pearls on the points -->
  <g fill="url(#gold)" stroke="#8a5f22" stroke-width="1">
    <circle cx="44" cy="100" r="7"/>
    <circle cx="98" cy="62" r="7"/>
    <circle cx="140" cy="32" r="8"/>
    <circle cx="182" cy="62" r="7"/>
    <circle cx="236" cy="100" r="7"/>
  </g>
  <g fill="#fff6d8" opacity=".75">
    <circle cx="41.5" cy="97.5" r="2.2"/>
    <circle cx="95.5" cy="59.5" r="2.2"/>
    <circle cx="137" cy="29" r="2.4"/>
    <circle cx="179.5" cy="59.5" r="2.2"/>
    <circle cx="233.5" cy="97.5" r="2.2"/>
  </g>

  <!-- central jewel -->
  <circle cx="140" cy="128" r="15" fill="url(#jewel)" stroke="url(#gold)" stroke-width="2.5"/>
  <circle cx="140" cy="128" r="8" fill="none" stroke="#f4efff" stroke-width="1" opacity=".5"/>
  <path d="M140 116 L147 128 L140 140 L133 128 Z" fill="#f4efff" opacity=".25"/>

  <!-- side jewels -->
  <g fill="url(#jewel)" stroke="url(#gold)" stroke-width="1.6">
    <path d="M72 116 L78 124 L72 132 L66 124 Z"/>
    <path d="M208 116 L214 124 L208 132 L202 124 Z"/>
  </g>

  <!-- base band -->
  <rect x="36" y="168" width="208" height="30" rx="6" fill="url(#gold)" stroke="#8a5f22" stroke-width="1.6"/>
  <path d="M38 191 H242" stroke="#8a5f22" stroke-width="1.2" opacity=".55"/>
  <g fill="url(#jewel)" stroke="#8a5f22" stroke-width="1.2">
    <path d="M86 174 L93 184 L86 194 L79 184 Z"/>
    <path d="M140 172 L149 184 L140 196 L131 184 Z"/>
    <path d="M194 174 L201 184 L194 194 L187 184 Z"/>
  </g>
  <g fill="#f4efff" opacity=".45">
    <circle cx="86" cy="181" r="2"/>
    <circle cx="140" cy="181" r="2.4"/>
    <circle cx="194" cy="181" r="2"/>
  </g>
  <g fill="url(#goldDark)">
    <circle cx="58" cy="176" r="2.4"/>
    <circle cx="112" cy="176" r="2.4"/>
    <circle cx="168" cy="176" r="2.4"/>
    <circle cx="222" cy="176" r="2.4"/>
  </g>

  <!-- electro spark -->
  <g fill="#b48cff">
    <path d="M232 40 L235 49 L244 52 L235 55 L232 64 L229 55 L220 52 L229 49 Z"/>
    <path d="M252 66 L253.5 71 L258 72.5 L253.5 74 L252 79 L250.5 74 L246 72.5 L250.5 71 Z" opacity=".75"/>
    <path d="M212 26 L213 30 L217 31 L213 32 L212 36 L211 32 L207 31 L211 30 Z" opacity=".6"/>
    <path d="M58 52 L60 59 L67 61 L60 63 L58 70 L56 63 L49 61 L56 59 Z" opacity=".55"/>
  </g>
</svg>
