<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.52"/>
      <stop offset="0.28" stop-color="#e2faff" stop-opacity="0.3"/>
      <stop offset="0.58" stop-color="#8fe6ff" stop-opacity="0.13"/>
      <stop offset="0.84" stop-color="#46c8ee" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#46c8ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="haze">
      <stop offset="0" stop-color="#8fe6ff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#8fe6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="veil" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="58"/>
    </filter>
    <path id="cone" d="M400 -50 L722 1120 L78 1120 Z" fill="url(#beam)"/>
    <path id="wide" d="M400 -90 L790 1120 L10 1120 Z" fill="url(#beam)"/>
  </defs>

  <ellipse cx="400" cy="130" rx="330" ry="150" fill="url(#haze)"/>

  <use href="#wide" filter="url(#veil)" opacity="0.34"/>
  <use href="#cone" filter="url(#soft)" opacity="0.95"/>

  <ellipse cx="400" cy="26" rx="150" ry="26" fill="#ffffff" fill-opacity="0.2" filter="url(#soft)"/>
  <ellipse cx="400" cy="44" rx="92" ry="18" fill="#e8fcff" fill-opacity="0.1" filter="url(#soft)"/>

  <g fill="#d7f8ff">
    <circle cx="362" cy="242" r="1.6" fill-opacity="0.32"/>
    <circle cx="452" cy="326" r="1.2" fill-opacity="0.26"/>
    <circle cx="392" cy="468" r="2" fill-opacity="0.2"/>
    <circle cx="498" cy="612" r="1.3" fill-opacity="0.22"/>
    <circle cx="306" cy="724" r="1.7" fill-opacity="0.18"/>
    <circle cx="432" cy="862" r="1.1" fill-opacity="0.2"/>
    <circle cx="372" cy="960" r="1.4" fill-opacity="0.14"/>
  </g>
</svg>
