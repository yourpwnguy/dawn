# dawn showcase: Furina, Regina of All Waters, Kindreds, Peoples and Laws,
# star of the Opera Epiclese and the Hydro Archon the audience adores.
#
# Furina is a divine performer who turns every trial into theatre, hides deep
# loneliness behind spectacle, and still insists the show must be perfect. The
# login is a Fontaine playbill: a swagged velvet curtain, a spotlight, a gold
# crown, hydro droplets, and a programme for the evening's verdict. Her
# constellation is Animula Choragi, the little soul of the chorus leader, and
# her signature dish is "Pour la Justice".
#
# The wallpaper is example media in the bundle. Check its
# provenance before redistributing it. Playing it needs ffmpeg on PATH.
#
# Noto Serif supplies the opera programme voice. If it is missing, dawn falls
# back to the embedded Inter face.

[ui]
font = "Noto Serif"
font_size = 17
fullscreen = true

[login]
layout = "hero"
anchor = "center"
width = 1888
height = 1048
radius = 0
padding = 0
gap = 20
surface = "none"
show_shadow = false
show_border = false
draggable = false
show_session = false
show_hints = true
show_picker = false
tab = ""
form_offset = [1210, 456]
form_width = 470
greeting = ""

[login.field]
height = 62
radius = 2
padding = 26
font_size = 17
background = "#081a3dee"
background_end = "#0b2350ee"
border = "#e8c98755"
bracket = "#46c8ee"
bracket_gap = 10
text = "#f7fbff"
placeholder_color = "#8fb6d8"
focus = "#46c8ee"
caret = "#e8c987"
caret_width = 2
icon_size = 19
icon_gap = 14
icon_color = "#8fe6ff"

[login.username]
label = "AUDIENCE"
placeholder = "Traveler name"
icon = "user"

[login.password]
label = "PASSCODE"
placeholder = "Password"
icon = "lock"
mask = "•"

[login.button]
show = true
text = "TAKE THE STAGE"
gap = 26
height = 58
radius = 2
font_size = 16
bold = true
tracking = 0.16
background = "#46c8ee"
background_end = "#1d6f9e"
gradient_angle = 90
text_color = "#06122b"
bracket = "#e8c987"
bracket_gap = 8
hover_background = "#8fe6ff"
hover_background_end = "#2a8ec0"
hover_direction = "left"
hover_ms = 220
hover_scale = 1.02
hover_lift = 2
glow = "#8fe6ff"
glow_size = 16
effect = "sweep"
effect_color = "#f7fbff"
effect_ms = 2200
effect_angle = 114
effect_strength = 0.32

