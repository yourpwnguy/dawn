<svg xmlns="http://www.w3.org/2000/svg" width="800" height="940" viewBox="0 0 800 940">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111a12"/>
      <stop offset="1" stop-color="#0a0f0c"/>
    </linearGradient>
    <radialGradient id="calm" cx="50%" cy="48%" r="58%">
      <stop offset="0" stop-color="#0a0f0c" stop-opacity=".72"/>
      <stop offset="1" stop-color="#0a0f0c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0V48M0 48H48" fill="none" stroke="#b8f34a" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="8" height="4" patternUnits="userSpaceOnUse">
      <rect width="8" height="1" fill="#0a0f0c" opacity=".38"/>
    </pattern>
    <clipPath id="panelClip">
      <path d="M48 12H752V24H768V36H788V904H768V916H752V928H48V916H32V904H12V36H32V24H48Z"/>
    </clipPath>
  </defs>

  <!-- A stepped tactical plate. The notched corners and dark core leave the
       form area quiet while the rim carries the quest-screen detail. -->
  <path d="M48 12H752V24H768V36H788V904H768V916H752V928H48V916H32V904H12V36H32V24H48Z"
        fill="none" stroke="#b8f34a" stroke-opacity=".12" stroke-width="10"/>
  <path d="M48 12H752V24H768V36H788V904H768V916H752V928H48V916H32V904H12V36H32V24H48Z"
        fill="url(#face)" stroke="#b8f34a" stroke-width="2"/>

  <g clip-path="url(#panelClip)">
    <rect width="800" height="940" fill="url(#grid)"/>
    <rect width="800" height="940" fill="url(#scan)"/>
    <rect x="24" y="24" width="752" height="892" fill="none"
          stroke="#2ad3a8" stroke-opacity=".16" stroke-width="2"/>
    <ellipse cx="400" cy="470" rx="304" ry="336" fill="url(#calm)"/>
    <path d="M48 40H752" fill="none" stroke="#b8f34a" stroke-opacity=".16" stroke-width="1"/>
    <path d="M48 900H752" fill="none" stroke="#2ad3a8" stroke-opacity=".14" stroke-width="1"/>

    <!-- Side rails: small ticks only, kept away from the central form area. -->
    <g stroke="#b8f34a" stroke-width="2" stroke-opacity=".28">
      <path d="M22 128h8M22 160h8M22 192h8M22 224h8M22 256h8M22 288h8M22 320h8M22 352h8M22 384h8M22 416h8M22 448h8M22 480h8M22 512h8M22 544h8M22 576h8M22 608h8M22 640h8M22 672h8M22 704h8M22 736h8M22 768h8"/>
      <path d="M770 128h8M770 160h8M770 192h8M770 224h8M770 256h8M770 288h8M770 320h8M770 352h8M770 384h8M770 416h8M770 448h8M770 480h8M770 512h8M770 544h8M770 576h8M770 608h8M770 640h8M770 672h8M770 704h8M770 736h8M770 768h8"/>
    </g>
    <g stroke="#ff6a3d" stroke-width="2" stroke-opacity=".7">
      <path d="M20 288h12M20 576h12M768 288h12M768 576h12"/>
    </g>
  </g>

  <!-- Coral header bar with a stepped tip. -->
  <path d="M52 54h160v5h12v7H52Z" fill="#ff6a3d"/>
  <rect x="232" y="58" width="8" height="8" fill="#f2e14c"/>
  <path d="M52 74h28v3H52ZM52 81h16v3H52ZM52 88h8v3H52Z" fill="#b8f34a" opacity=".62"/>
  <path d="M52 98h4v4h-4Z" fill="#2ad3a8" opacity=".8"/>

  <!-- Sparse top-right telemetry blocks. -->
  <path d="M748 54h-64v4h-20v4h-8v4h92Z" fill="#b8f34a" opacity=".24"/>
  <path d="M748 70h-44v3h-14v3h58Z" fill="#2ad3a8" opacity=".3"/>
  <path d="M748 82h-24v3h-8v3h32Z" fill="#ff6a3d" opacity=".65"/>

  <!-- Top inside notches. -->
  <path d="M64 118h28v4H64ZM80 126h12v4H80Z" fill="#b8f34a" opacity=".2"/>
  <path d="M736 118h-28v4h28ZM720 126h-12v4h12Z" fill="#b8f34a" opacity=".2"/>

  <!-- Bottom coral bar, mirrored from the top accent. -->
  <path d="M748 882H588v5h-12v7h172Z" fill="#ff6a3d"/>
  <rect x="560" y="886" width="8" height="8" fill="#f2e14c"/>
  <path d="M748 874h-28v-3h28ZM748 867h-16v-3h16ZM748 860h-8v-3h8Z" fill="#b8f34a" opacity=".55"/>

  <!-- Quiet status blocks along the foot. No labels, no text. -->
  <path d="M52 886h72v4H52Z" fill="#b8f34a" opacity=".3"/>
  <rect x="132" y="886" width="6" height="4" fill="#2ad3a8"/>
  <path d="M326 884h30v8h-30ZM362 884h54v8h-54ZM422 884h16v8h-16ZM444 884h34v8h-34Z"
        fill="#b8f34a" opacity=".32"/>
  <rect x="486" y="884" width="10" height="8" fill="#ff6a3d" opacity=".7"/>

  <!-- Small foot ticks to close the frame. -->
  <path d="M64 906h32v3H64ZM64 913h16v3H64ZM736 906h-32v3h32ZM736 913h-16v3h16Z"
        fill="#2ad3a8" opacity=".3"/>
</svg>
