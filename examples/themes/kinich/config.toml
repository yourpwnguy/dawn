bold = true
color = "#17191C"
anchor = "top-left"
offset = [56, 430]

[[login.decor]]
kind = "text"
text = "> BOOT // SCIONS OF THE CANOPY TS 0.1"
size = 11
tracking = 0.08
color = "#17191C"
anchor = "top-left"
offset = [56, 462]

[login.decor.motion]
typer_ms = 700

[[login.decor]]
kind = "text"
text = "> LINK STABLE // HUITZTLAN NET ONLINE."
size = 11
tracking = 0.08
color = "#17191C"
anchor = "top-left"
offset = [56, 484]

[login.decor.motion]
typer_ms = 1800

[[login.decor]]
kind = "text"
text = "> CONTRACT 077 REGISTERED."
size = 11
tracking = 0.08
color = "#17191C"
anchor = "top-left"
offset = [56, 506]

[login.decor.motion]
typer_ms = 3000

[[login.decor]]
kind = "text"
text = "> FEE SCHEDULE SYNCED."
size = 11
tracking = 0.08
color = "#17191C"
anchor = "top-left"
offset = [56, 528]

[login.decor.motion]
typer_ms = 4300

[[login.decor]]
kind = "text"
text = "> AWAITING OPERATOR CONFIRMATION."
size = 11
tracking = 0.08
color = "#17191C"
anchor = "top-left"
offset = [56, 550]

[login.decor.motion]
typer_ms = 5600

[[login.decor]]
kind = "image"
image = "assets/cursorbar.png"
width = 8
anchor = "top-left"
offset = [300, 552]

[login.decor.motion]
blink_ms = 900

[motion]
enabled = true
reduced = false
boot_ms = 600
focus_ms = 160
shake_ms = 300
drag_ms = 100
decor_fps = 60

[layout]
save = false

[clock]
enabled = true
layer = "front"
style = "digital"
time_format = "%H:%M"
date_format = ""
size = 15
anchor = "bottom-right"
offset = [48, 12]
color = "#F7F3E9"

[media]
enabled = false

[power]
low_power = false

[sessions]
dirs = ["/usr/share/wayland-sessions", "/usr/share/xsessions"]
default = "hyprland"

[plugins]
enabled = false

[auth]
timeout_secs = 120
