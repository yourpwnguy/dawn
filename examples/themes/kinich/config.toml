# dawn showcase: Kinich, Huitztlan Saurian Hunter of the Scions of the
# Canopy, partner of the ancient pixel dragon K'uhul Ajaw.
#
# Kinich is calm, direct, and efficient, and he believes everything has a
# price. Ajaw is a smug 8-bit relic who never stops complaining. The login is
# a tactical quest screen in the jungle: charcoal HUD, hi-vis lime, hot coral,
# pixel brackets, a status bar, and Ajaw hovering nearby. His constellation is
# Chimaera Alebriius and his signature dish is "Saurian Hunter's Reward".
#
# The wallpaper is example media in the bundle. Check its
# provenance before redistributing it. Playing it needs ffmpeg on PATH.
#
# GeistMono carries the HUD voice. If it is missing, dawn falls back to the
# embedded Inter face.

[ui]
font = "GeistMono Nerd Font"
font_size = 16
fullscreen = true

[login]
layout = "hero"
anchor = "center"
width = 1888
height = 1048
radius = 0
padding = 0
gap = 20
surface = "none"
show_shadow = false
show_border = false
draggable = false
show_session = false
show_hints = true
show_picker = false
tab = ""
form_offset = [1210, 416]
form_width = 470
greeting = ""

[login.field]
height = 60
radius = 0
padding = 26
font_size = 16
background = "#0d1710ee"
background_end = "#111a12ee"
border = "#b8f34a55"
bracket = "#ff6a3d"
bracket_gap = 10
text = "#e9eadf"
placeholder_color = "#8aa08c"
focus = "#b8f34a"
caret = "#b8f34a"
caret_width = 2
icon_size = 18
icon_gap = 14
icon_color = "#b8f34a"

[login.username]
label = "HUNTER ID"
placeholder = "Traveler name"
icon = "user"

[login.password]
label = "ACCESS CODE"
placeholder = "Password"
icon = "lock"
mask = "•"

[login.button]
show = true
text = "ACCEPT QUEST"
gap = 26
height = 56
radius = 0
font_size = 16
bold = true
tracking = 0.14
background = "#b8f34a"
background_end = "#2ad3a8"
gradient_angle = 90
text_color = "#0a0f0c"
bracket = "#ff6a3d"
bracket_gap = 8
hover_background = "#d7ff82"
hover_background_end = "#5af0c0"
hover_direction = "center"
hover_ms = 180
hover_scale = 1.02
hover_lift = 2
glow = "#b8f34a"
glow_size = 14
effect = "corners"
effect_color = "#0a0f0c"
effect_ms = 1600
effect_angle = 120
effect_strength = 0.5

