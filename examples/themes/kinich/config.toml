# Kinich: contract terminal.
# A full-bleed HUD over the acid-yellow video field. The interface frames the
# subject instead of covering it: chrome in the corners, the console on the
# right, the boot log on the left, and a live mission feed along the bottom.

[ui]
font = "Inter"
font_size = 15
fullscreen = true

[background]
kind = "video"
image = "wallpaper.mp4"
fit = "cover"
fps = 0
memory_limit_mb = 1024
idle_pause_secs = 0

[theme]
preset = "minimal"
text = "#17191C"
muted = "#4E5148"
accent = "#E2734F"
error = "#D64A32"
tint = "#17191CB3"
border = "#E7DA1980"
shadow = "#00000055"
focus_ring = "#E2734F"
corner_radius = 0
spacing = 1.0
noise = false
min_contrast = 4.5

[theme.blur]
enabled = false

[login]
layout = "hero"
anchor = "center"
offset = [0, 0]
width = 1920
height = 1080
padding = 0
gap = 20
radius = 0
surface = "none"
show_shadow = false
show_border = false
form_offset = [1568, 380]
form_width = 336
draggable = false
show_session = true
show_hints = true
busy_text = "SIGNING // HOLD THE LINE."
no_sessions = "NO DEPLOY TARGETS ONLINE"

[login.field]
height = 46
padding = 12
background = "#17191CE6"
underline = "#E7DA19A6"
underline_size = 2
label_color = "#4E5148"
placeholder_color = "#F7F3E9A6"
text = "#F7F3E9"
caret = "#F7F3E9"
caret_style = "block"
icon_color = "#E7DA19"

[login.username]
label = "OPERATOR"
placeholder = "call sign"
icon = "user"

[login.password]
label = "KEYCODE"
placeholder = "access key"
icon = "lock"

[login.button]
show = true
text = "ENGAGE"
gap = 24
height = 54
radius = 2
font_size = 17
background = "#E7DA19"
background_end = "#C6D62B"
gradient_angle = 90
text_color = "#17191C"
bracket = "#17191C"
bracket_gap = 10
bold = true
tracking = 0.2
hover_background = "#E2734F"
hover_direction = "left"
hover_ms = 240
glow = "#E2734F"
glow_size = 14
effect = "sweep"
effect_color = "#F7F3E9"
effect_ms = 3200
effect_strength = 0.35

[login.session]
label = "DEPLOY TARGET"
change_hint = "TAB TO SWAP"
empty = "NO DEPLOY TARGETS ONLINE"

[login.hints]
picker = "UP/DOWN  SELECT      ENTER  DEPLOY      ESC  CLOSE"

# ---- full-screen card is the fabric; everything below pins to its edges ----

# Bottom mission bar: ink plate first, then the feed text over it.
[[login.decor]]
kind = "image"
image = "assets/metabar.png"
width = 1920
anchor = "bottom-left"
offset = [0, 0]

[[login.decor]]
kind = "text"
text = "MISSION FEED"
size = 10
tracking = 0.3
bold = true
color = "#E7DA19"
anchor = "bottom-left"
offset = [36, 15]

[[login.decor]]
kind = "text"
text = "NO COMMISSION TOO SMALL · NO PRICE TOO HIGH · SCIONS OF THE CANOPY · HUITZTLAN UPLINK STABLE · SEASON 7 NIGHT WARDEN PATROL · AJAW CONTRACTING OPEN FOR BUSINESS · DAWN TERMINAL v0.2"
size = 12
tracking = 0.18
color = "#E7DA19"
anchor = "bottom-left"
offset = [248, 16]

[login.decor.motion]
ticker_ms = 22000
ticker_width = 1400
ticker_gap = 96

# Viewport target marks: one bracket, four corners, no new art needed.
[[login.decor]]
kind = "image"
image = "assets/corner-bracket.png"
width = 52
anchor = "top-left"
offset = [44, 44]

[[login.decor]]
kind = "image"
image = "assets/corner-bracket.png"
width = 52
anchor = "top-right"
offset = [44, 44]
rotation = 90

[[login.decor]]
kind = "image"
image = "assets/corner-bracket.png"
width = 52
anchor = "bottom-right"
offset = [44, 56]
rotation = 180

[[login.decor]]
kind = "image"
image = "assets/corner-bracket.png"
width = 52
anchor = "bottom-left"
offset = [44, 56]
rotation = 270

# Top-left mission cluster replaces the old wordmark block.
[[login.decor]]
kind = "image"
image = "assets/chip-ink.png"
width = 17
anchor = "top-left"
offset = [60, 58]

[login.decor.motion]
spin = 24

[[login.decor]]
kind = "text"
text = "SCIONS OF THE CANOPY"
size = 11
tracking = 0.2
bold = true
color = "#17191C"
anchor = "top-left"
offset = [96, 62]

[[login.decor]]
kind = "text"
text = "CONTRACT 077 · TURNFIRE HUNT"
size = 10
tracking = 0.18
color = "#4E5148"
anchor = "top-left"
offset = [96, 86]

# Ajaw, the pixel buddy, hovering by the console.
[[login.decor]]
kind = "image"
image = "assets/ajaw.png"
width = 44
anchor = "top-right"
offset = [56, 140]

[login.decor.motion]
float = [0, -10]
float_ms = 4000

[[login.decor]]
kind = "text"
text = "AJAW // ON WATCH"
size = 8
tracking = 0.3
color = "#4E5148"
anchor = "top-right"
offset = [58, 196]

# Bolt echoes: the video's chips, a beacon row under the left boot log.
[[login.decor]]
kind = "image"
image = "assets/chip-coral.png"
width = 14
anchor = "top-left"
offset = [64, 642]

[login.decor.motion]
float = [8, -6]
float_ms = 5200

[[login.decor]]
kind = "image"
image = "assets/chip-sky.png"
width = 12
anchor = "top-left"
offset = [100, 654]

[login.decor.motion]
float = [0, -8]
float_ms = 6400
phase = 0.33

[[login.decor]]
kind = "image"
image = "assets/chip-citrus.png"
width = 11
anchor = "top-left"
offset = [136, 646]

[login.decor.motion]
float = [-8, -4]
float_ms = 7600
phase = 0.66

# Right console heading (sits on the yellow field, ink on yellow).
[[login.decor]]
kind = "text"
text = "CONTRACT CONFIRMATION"
size = 11
tracking = 0.3
color = "#17191C"
anchor = "top-left"
offset = [1568, 244]

[[login.decor]]
kind = "text"
text = "TURNFIRE HUNT"
size = 30
bold = true
tracking = 0.12
color = "#17191C"
anchor = "top-left"
offset = [1564, 268]

[[login.decor]]
kind = "text"
text = "AUTHORIZE UPLINK"
size = 30
bold = true
tracking = 0.12
color = "#17191C"
anchor = "top-left"
offset = [1564, 312]

[[login.decor]]
kind = "image"
image = "assets/rule-coral.png"
width = 336
anchor = "top-left"
offset = [1548, 362]

[[login.decor]]
kind = "text"
text = "THE HUNT SETS ITS OWN PRICE."
size = 9
tracking = 0.18
color = "#4E5148"
anchor = "top-left"
offset = [1568, 736]

# Left rail: service log types itself in on boot.
[[login.decor]]
kind = "text"
text = "SERVICE LOG"
size = 11
