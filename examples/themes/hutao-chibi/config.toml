[background]
kind = "video"
image = "wallpaper.mp4"
fit = "cover"
fps = 0
memory_limit_mb = 1024
idle_pause_secs = 0

[theme]
preset = "glass-dark"
text = "#1c1512"
muted = "#6b4a3e"
accent = "#b83a2e"
error = "#a32828"
tint = "#f2e6d0cc"
border = "#b83a2e33"
shadow = "#2a1810aa"
focus_ring = "#2f8f6b"
corner_radius = 0
spacing = 1.0
noise = false
