# dawn showcase: chibi Hu Tao as a cardless Wangsheng system terminal.
#
# The wallpaper keeps the character. The right third is the login surface: a
# strict typographic grid, line fields instead of boxes, a thin rune rule, a
# slow HUD ring, and small game-status details. Nothing sits on a card.
#
# Hu Tao is the 77th Director of the Wangsheng Funeral Parlor, so the terminal
# speaks in that voice: director credentials, a 77 seal, a daily commission,
# and a login streak. The copy stays a login screen first and lore second.
#
# The wallpaper is example media in the bundle. Check its
# provenance before redistributing it. Playing it needs ffmpeg on PATH.
#
# Plus Jakarta Sans gives the terminal a modern product interface voice. If it
# is missing, dawn falls back to the embedded Inter face.

[ui]
font = "Plus Jakarta Sans"
font_size = 17
fullscreen = true

[login]
layout = "hero"
anchor = "center"
width = 1888
height = 1048
radius = 0
padding = 0
gap = 26
surface = "none"
show_shadow = false
show_border = false
draggable = false
show_session = false
show_hints = true
show_picker = false
tab = ""
form_offset = [1430, 420]
form_width = 370
greeting = ""

[login.hints]
username = "ENTER  AUTHORIZE      TAB  NEXT FIELD      ESC  CLEAR"
password = "ENTER  AUTHORIZE      TAB  NEXT FIELD      ESC  CLEAR"

[login.field]
height = 54
radius = 0
padding = 2
font_size = 18
background = "#00000000"
border = "#00000000"
underline = "#b83a2e"
underline_size = 1.5
text = "#1c1512"
placeholder_color = "#8a6e60"
focus = "#2f8f6b"
caret = "#b83a2e"
caret_width = 2
label_color = "#2f8f6b"

[login.username]
label = "DIRECTOR NAME"
placeholder = "Enter your name"

[login.password]
label = "PASSCODE"
placeholder = "Enter passcode"
mask = "•"

[login.button]
show = true
text = "AUTHORIZE  →"
gap = 34
height = 54
radius = 0
font_size = 16
bold = true
tracking = 0.16
background = "#b83a2e"
background_end = "#8d2530"
gradient_angle = 90
text_color = "#fff4e2"
hover_background = "#d14a37"
hover_background_end = "#a32c35"
hover_direction = "up"
hover_ms = 180
hover_scale = 1.01
hover_lift = 3
glow = "#ff8a5a"
glow_size = 12
effect = "corners"
effect_color = "#f4e6cf"
effect_ms = 1800
effect_angle = 120
effect_strength = 0.5

