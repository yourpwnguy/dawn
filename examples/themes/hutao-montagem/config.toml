# dawn showcase: Hu Tao, 77th Director of the Wangsheng Funeral Parlor.
#
# AFTER DARK: THE STAGE CALL. The wallpaper is the stage: hard-cut crimson
# kinetic type and Hu Tao dancing. Nothing floats on a card here. The poster is
# the login: the headline is set directly on the video, the credentials sit on
# two crimson hairlines at the lower left, and the session list is the support
# act on the bottom marquee. Hairlines are the only chrome.
#
# The theme needs IBM Plex Sans Condensed for the poster voice. If it is
# missing, dawn falls back to the embedded Inter face and the layout still
# works: nothing is measured from the condensed face at config time.
#
# The wallpaper is example media in the bundle. Check its provenance before
# redistributing it. Playing it needs ffmpeg on PATH.

[ui]
font = "IBM Plex Sans Condensed"
font_size = 16
fullscreen = true

[background]
kind = "video"
image = "wallpaper.mp4"
fit = "cover"
fps = 0
memory_limit_mb = 1024
idle_pause_secs = 0

[theme]
preset = "glass-dark"
text = "#f3e7d2"
muted = "#b9a893"
accent = "#d8a84b"
error = "#ff7a3c"
tint = "#0e0b1000"
border = "#d8a84b00"
shadow = "#0e0b1000"
focus_ring = "#d41830"
corner_radius = 0
spacing = 1.0
noise = false
min_contrast = 3.0
scanlines = 0.0

[theme.blur]
enabled = false

[motion]
enabled = true
reduced = false
boot_ms = 520
focus_ms = 160
shake_ms = 240
drag_ms = 120

[layout]
save = false

# Top-left stack: the presenter, the clock, the date. No plate.
[clock]
enabled = true
style = "digital"
layer = "behind"
anchor = "top-left"
offset = [72, 66]
size = 64
date_size = 14
time_format = "%H:%M"
date_format = "%a %d %b"
color = "#f3e7d2"
date_color = "#ff6274"
label = "WANGSHENG PRESENTS"
label_color = "#d8a84b"
label_size = 11
label_tracking = 0.3

[clock.plate]
style = "none"

# The login is inline type, not a form in a box. Poster is the full-bleed
# frame with no surface; the two rules are the only chrome and the selected
# session lives in the marquee, not in a card.
[login]
layout = "poster"
anchor = "center"
offset = [0, 0]
width = 1920
height = 1080
padding = 0
gap = 16
radius = 0
surface = "none"
show_shadow = false
show_border = false
draggable = false
show_session = false
show_hints = true
show_picker = true
show_dry_run_badge = true
tab = ""
greeting = ""
form_offset = [72, 700]
form_width = 660
busy_text = "TAKING THE STAGE"
no_sessions = "NO SUPPORT ACT ON THE BILL"

[login.field]
height = 74
font_size = 44
radius = 0
padding = 1
background = "#00000000"
underline = "#d41830"
underline_size = 2
label_size = 11
label_tracking = 0.3
label_color = "#d8a84b"
text = "#f3e7d2"
placeholder_color = "#b9a89399"
focus = "#d41830"
caret = "#ff7a3c"
caret_width = 2
caret_style = "bar"
icon = ""
key_pop_ms = 140
key_pop_scale = 1.18
key_pop_color = "#ff7a3c"

[login.username]
label = "YOU ARE"
placeholder = "YOUR NAME"

[login.password]
label = "THE PASSCODE"
placeholder = "\u25c6 \u25c6 \u25c6 \u25c6 \u25c6 \u25c6"
mask = "\u25c6"

[login.button]
show = false

[login.hints]
username = "ENTER \u00b7 TAKE THE STAGE    TAB \u00b7 PASSCODE"
password = "ENTER \u00b7 TAKE THE STAGE    TAB \u00b7 SUPPORT ACT"
picker = "UP/DOWN \u00b7 CHOOSE    ENTER \u00b7 CONFIRM    ESC \u00b7 BACK"
busy = "TAKING THE STAGE"

# The poster headline. The hero frame is full-bleed and unpainted, so these
# offsets are screen coordinates, not a card.
[[login.decor]]
kind = "text"
text = "TONIGHT:"
size = 76
bold = true
tracking = 0.02
color = "#f3e7d2"
stroke = "#0e0b10"
stroke_width = 2
anchor = "top-left"
offset = [72, 326]

[[login.decor]]
kind = "text"
text = "HUTAO"
size = 156
bold = true
tracking = 0.01
color = "#8a0b1b"
stroke = "#0e0b10"
stroke_width = 3
anchor = "top-left"
offset = [72, 410]

# A crimson hairline between the headline and the form, the only other chrome
# on the poster.
[[login.decor]]
kind = "panel"
width = 660
height = 4
color = "#d8a84b55"
anchor = "top-left"
offset = [72, 664]

# A small credit above the headline, kept out of Hu Tao's wing.
[[login.decor]]
kind = "text"
text = "AFTER DARK / ONE NIGHT ONLY"
size = 11
tracking = 0.24
color = "#d8a84b"
anchor = "top-left"
offset = [72, 292]

# Embers from the stage floor. Calm by design: 24 low-opacity flames.
[particles]
enabled = true
count = 24
sprite = "flame"
color = "#ffb46b"
color2 = "#f3e7d2"
drift = "up"
speed = 20.0
size = 6.5
opacity = 0.4
layer = "behind"
burst_on = "success"
burst_sprite = "butterfly"
burst_count = 64

# The support act: the live session name is first, then the bill. Radius zero,
# a translucent black strip, and a crimson rule along its top edge.
[ticker]
enabled = true
session_first = true
items = [
  "77TH DIRECTOR",
  "LIVE AT THE PARLOR",
  "ONE MORE SONG BEFORE THE WITCHING HOUR",
  "NO REFUNDS. NO REGRETS.",
]
separator = "   \u00b7   "
anchor = "bottom"
offset = [0, 24]
size = 17
speed = 40.0
color = "#d41830"
bold = true
tracking = 0.2
layer = "behind"

[ticker.plate]
style = "solid"
color = "#0e0b10d9"
radius = 0
padding = 12
border = "#d4183044"

# The success montage: two hard cuts, then the call slams over a transparent
# field while the butterfly burst fills the stage. The transparent last cut is
# deliberate, it lets the burst read through the slam. The hold is the normal
# success hold and is capped by dawn at two seconds.
[login.transition]
enabled = true
trigger = "success"
cuts = ["#d41830", "#0e0b10", "#00000000"]
cut_ms = 55
shake = 8.0
zoom = 0.06
slam = "TAKE THE STAGE"
slam_ms = 1500
slam_color = "#f3e7d2"
slam_size = 110

# Kept, restyled: a small hairline player for a desktop dry run. Off by
# default because the right wing belongs to Hu Tao.
[media]
enabled = false
anchor = "bottom-right"
offset = [72, 120]
size = 13
layout = "compact"
show_art = false
color = "#f3e7d2"
layer = "behind"

[media.plate]
style = "none"

[power]
low_power = false

[sessions]
dirs = ["/usr/share/wayland-sessions", "/usr/share/xsessions"]

[plugins]
enabled = false

[auth]
timeout_secs = 120
