# dawn showcase: Hu Tao After Dark, a late-night Liyue concert poster for the
# 77th Director of the Wangsheng Funeral Parlor.
#
# Hu Tao is a poet, prankster, and guide of the dead who makes mortality feel
# like a party without ever disrespecting the rites. This theme leans into the
# meme energy of the source clip: crimson and black, marquee bulbs, a cheeky
# ghost flame, a butterfly (Papilio Charontis), and a ticket stub for the
# night's set. The copy still keeps her real work in view.
#
# The wallpaper is example media in the bundle. Check its
# provenance before redistributing it. Playing it needs ffmpeg on PATH.
#
# D-DIN Condensed gives the poster its loud, narrow voice. If it is missing,
# dawn falls back to the embedded Inter face.

[ui]
font = "D-DIN Condensed"
font_size = 17
fullscreen = true

[login]
