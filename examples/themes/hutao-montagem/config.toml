anchor = "center"
width = 1888
height = 1048
radius = 0
padding = 0
gap = 20
surface = "none"
show_shadow = false
show_border = false
draggable = false
show_session = false
show_hints = true
show_picker = false
tab = ""
form_offset = [1210, 446]
form_width = 470
